<svg viewBox="0 0 960 690" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="690" fill="#ffffff"/>

  <!-- UI layer -->
  <rect x="250" y="24" width="460" height="62" rx="10" fill="#eef3fb" stroke="#3b6fd4" stroke-width="1.5"/>
  <text x="480" y="50" text-anchor="middle" font-size="15" font-weight="600" fill="#1a3f7a">UI — ChatView · AppView · StatusIndicator</text>
  <text x="480" y="72" text-anchor="middle" font-size="11" fill="#4a659c">sees only ModelManager — never an engine import</text>

  <line x1="480" y1="86" x2="480" y2="122" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SwiftData -->
  <rect x="30" y="140" width="175" height="84" rx="10" fill="#fdf6ec" stroke="#c98a2b" stroke-width="1.5"/>
  <text x="117" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#7a5416">SwiftData</text>
  <text x="117" y="188" text-anchor="middle" font-size="12" fill="#7a5416">Conversation · Message</text>
  <text x="117" y="206" text-anchor="middle" font-size="11" fill="#a3782f">model switchable per chat</text>

  <line x1="205" y1="182" x2="246" y2="182" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="225" y="172" text-anchor="middle" font-size="11" fill="#555">[ChatTurn]</text>

  <!-- ModelManager -->
  <rect x="250" y="126" width="460" height="122" rx="10" fill="#ffffff" stroke="#333" stroke-width="1.8"/>
  <text x="480" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#111">ModelManager  (@Observable, @MainActor)</text>
  <text x="480" y="176" text-anchor="middle" font-size="12.5" fill="#222">reply(to: [ChatTurn], using: model, options:) → stream of snapshots</text>
  <text x="480" y="196" text-anchor="middle" font-size="12.5" fill="#222">query(_ prompt:) async → String   (one-shot: titles, tags)</text>
  <text x="480" y="220" text-anchor="middle" font-size="11.5" fill="#666">register / unregister · refresh · capabilities(of:) · model(withID:) · fallbackModel</text>
  <text x="480" y="238" text-anchor="middle" font-size="11.5" fill="#666">routes by BackendID — refuses models that aren't .available</text>

  <!-- Seam -->
  <line x1="30" y1="288" x2="930" y2="288" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="7 5"/>
  <rect x="285" y="274" width="390" height="26" rx="13" fill="#f7effc" stroke="#8e44ad" stroke-width="1.2"/>
  <text x="480" y="292" text-anchor="middle" font-size="12.5" font-weight="600" fill="#6b2f86">protocol ChatBackend — availableModels · capabilities · reply</text>

  <!-- Arrows to backends -->
  <line x1="360" y1="248" x2="172" y2="326" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="480" y1="248" x2="480" y2="326" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="600" y1="248" x2="788" y2="326" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- AppleBackend (shipping) -->
  <rect x="30" y="330" width="280" height="172" rx="10" fill="#f0f7ff" stroke="#0a84ff" stroke-width="1.8"/>
  <text x="170" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#0a5bbf">AppleBackend</text>
  <text x="170" y="372" text-anchor="middle" font-size="11" fill="#0a5bbf">BackendID.apple — shipping</text>
  <rect x="44" y="388" width="122" height="86" rx="8" fill="#ffffff" stroke="#7fb4ee" stroke-width="1.3"/>
  <text x="105" y="408" text-anchor="middle" font-size="12" font-weight="600" fill="#155a9e">Route.device</text>
  <text x="105" y="426" text-anchor="middle" font-size="10.5" fill="#456d94">On Device</text>
  <text x="105" y="442" text-anchor="middle" font-size="10.5" fill="#456d94">params: nil</text>
  <text x="105" y="458" text-anchor="middle" font-size="10.5" fill="#456d94">(for now)</text>
  <rect x="176" y="388" width="122" height="86" rx="8" fill="#ffffff" stroke="#7fb4ee" stroke-width="1.3"/>
  <text x="237" y="408" text-anchor="middle" font-size="12" font-weight="600" fill="#155a9e">Route.cloud</text>
  <text x="237" y="426" text-anchor="middle" font-size="10.5" fill="#456d94">Private Cloud</text>
  <text x="237" y="442" text-anchor="middle" font-size="10.5" fill="#456d94">params: reasoning,</text>
  <text x="237" y="458" text-anchor="middle" font-size="10.5" fill="#456d94">quota-aware</text>

  <!-- VendorBackend (later) -->
  <rect x="340" y="330" width="280" height="172" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="480" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#666">VendorBackend</text>
  <text x="480" y="372" text-anchor="middle" font-size="11" fill="#888">generated BackendID — later</text>
  <text x="480" y="400" text-anchor="middle" font-size="11.5" fill="#666">ProviderConfig (Codable)</text>
  <text x="480" y="418" text-anchor="middle" font-size="11.5" fill="#666">endpoint · dialect · Keychain auth ref</text>
  <text x="480" y="444" text-anchor="middle" font-size="11.5" fill="#666">WireAdapter: .openAI · .anthropic</text>
  <text x="480" y="462" text-anchor="middle" font-size="11.5" fill="#666">deltas accumulated → snapshots</text>

  <!-- CustomBackend (later) -->
  <rect x="650" y="330" width="280" height="172" rx="10" fill="#fafafa" stroke="#999" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="790" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#666">CustomBackend</text>
  <text x="790" y="372" text-anchor="middle" font-size="11" fill="#888">generated BackendID — later</text>
  <text x="790" y="400" text-anchor="middle" font-size="11.5" fill="#666">WeightsSource: .safetensors / .gguf</text>
  <text x="790" y="418" text-anchor="middle" font-size="11.5" fill="#666">quantization · lazy load / unload</text>
  <text x="790" y="444" text-anchor="middle" font-size="11.5" fill="#666">available iff file on disk + RAM</text>
  <text x="790" y="462" text-anchor="middle" font-size="11.5" fill="#666">ModelWeights == .mutable</text>

  <!-- Engine arrows -->
  <line x1="105" y1="502" x2="105" y2="536" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="237" y1="502" x2="237" y2="536" stroke="#555" stroke-width="1.3" marker-end="url(#arrow)"/>
  <line x1="480" y1="502" x2="480" y2="536" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="790" y1="502" x2="790" y2="536" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

  <!-- Engines -->
  <rect x="30" y="540" width="140" height="72" rx="8" fill="#ffffff" stroke="#7fb4ee" stroke-width="1.3"/>
  <text x="100" y="566" text-anchor="middle" font-size="11.5" font-weight="600" fill="#155a9e">SystemLanguage</text>
  <text x="100" y="582" text-anchor="middle" font-size="11.5" font-weight="600" fill="#155a9e">Model</text>
  <text x="100" y="600" text-anchor="middle" font-size="10.5" fill="#456d94">FoundationModels</text>
  <rect x="180" y="540" width="130" height="72" rx="8" fill="#ffffff" stroke="#7fb4ee" stroke-width="1.3"/>
  <text x="245" y="566" text-anchor="middle" font-size="11.5" font-weight="600" fill="#155a9e">PrivateCloud-</text>
  <text x="245" y="582" text-anchor="middle" font-size="11.5" font-weight="600" fill="#155a9e">ComputeLM</text>
  <text x="245" y="600" text-anchor="middle" font-size="10.5" fill="#456d94">macOS 27+, iCloud quota</text>
  <rect x="340" y="540" width="280" height="72" rx="8" fill="#fafafa" stroke="#aaa" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="480" y="572" text-anchor="middle" font-size="12" fill="#666">HTTPS + SSE — provider APIs</text>
  <text x="480" y="592" text-anchor="middle" font-size="10.5" fill="#888">URLSession only inside the adapter</text>
  <rect x="650" y="540" width="280" height="72" rx="8" fill="#fafafa" stroke="#aaa" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="790" y="572" text-anchor="middle" font-size="12" fill="#666">MLX runtime — local weight files</text>
  <text x="790" y="592" text-anchor="middle" font-size="10.5" fill="#888">no network, user-provided models</text>

  <!-- Footer -->
  <text x="480" y="648" text-anchor="middle" font-size="11.5" fill="#777">model ID namespace:  apple.on-device · apple.private-cloud · vendor.&lt;id&gt;.&lt;model&gt; · custom.&lt;id&gt;</text>
  <text x="480" y="668" text-anchor="middle" font-size="10.5" fill="#aaa">invariants: UI never imports engines · backends never import SwiftData · descriptors are pure data · streams yield snapshots</text>
</svg>
